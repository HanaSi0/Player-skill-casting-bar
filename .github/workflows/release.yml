name: Build and publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DALAMUD_HOME: ${{ github.workspace }}/.dalamud
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.401'
      - name: Download verified Dalamud API 15 assemblies
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/goatcorp/dalamud-distrib/3d6beb981fb6d2f238fd9b907e366d948242673d/latest.zip -o /tmp/dalamud.zip
          echo '560d283b63d5d70dd5fa7eeb79e7a9cb5139b3dcc63e0cb01b466a57b020fcaa  /tmp/dalamud.zip' | sha256sum -c -
          python3 -c 'import os, zipfile; zipfile.ZipFile("/tmp/dalamud.zip").extractall(os.environ["DALAMUD_HOME"])'
      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore PlayerCastBars.csproj --locked-mode
          dotnet build PlayerCastBars.csproj -c Release --no-restore
          dotnet run --project tests/PlayerCastBars.Tests.csproj -c Release
      - name: Prepare release package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp bin/Release/PlayerCastBars/latest.zip release/PlayerCastBars.zip
          cd release
          sha256sum PlayerCastBars.zip > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/PlayerCastBars.zip release/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" release/PlayerCastBars.zip release/SHA256SUMS.txt --verify-tag --title "Player Cast Bars $RELEASE_TAG" --notes-file .github/release-notes.md
          fi
